# LaMusica — Build & push XL-Turbo RunPod worker image
# Triggers: manual dispatch OR any push to main
#
# GITHUB_TOKEN authenticates to GHCR automatically.
# Image is PRIVATE (inherits repo visibility).

name: Build XL-Turbo Worker

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set lowercase owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: echo "OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/share/swift /usr/local/graalvm \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune -af
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/lamusica-xl-worker:latest
            ghcr.io/${{ env.OWNER }}/lamusica-xl-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Pushed ghcr.io/${{ env.OWNER }}/lamusica-xl-worker:latest"
